services:
  - type: web
    name: nearpool
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node server.mjs
    # server.mjs serves the SPA (with history fallback and immutable caching
    # for hashed assets) and the shared activity feed (/api/activity/*),
    # which re-verifies every published injection against NEAR RPC.
    # Set TURSO_DATABASE_URL / TURSO_AUTH_TOKEN for durable feed storage.
