# Cloudflare Workers deployment (Workers + static assets). See DEPLOY_CLOUDFLARE.md.
name = "nearpool"
main = "worker/index.ts"
compatibility_date = "2026-09-01"

# Build the site before every `wrangler deploy` / `versions upload` / `dev`,
# so Cloudflare Workers Builds works even if its dashboard build command is
# empty (otherwise ./dist doesn't exist and the deploy fails).
[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Create with: npx wrangler d1 create nearpool-activity
# then paste the returned database_id below and run the migration.
[[d1_databases]]
binding = "DB"
database_name = "nearpool-activity"
database_id = "5a81f944-1f99-4d49-b9c0-8e891d43e327"
migrations_dir = "migrations"

# NEAR_RPC_URL is a secret (it holds your RPC provider's API key):
#   npx wrangler secret put NEAR_RPC_URL
# Unset, it defaults to https://rpc.mainnet.near.org.
[vars]
# --- Browser build settings (VITE_*) ---
# Read by vite.config.js at build time and compiled into the site, so they're
# public: never put an API key here. Changing one needs a redeploy (rebuild).
# A variable of the same name set in the shell or in Workers Builds settings
# overrides the value here.
VITE_NEAR_FALLBACK_RPC_URLS = "https://free.rpc.fastnear.com,https://near.lava.build,https://rpc.mainnet.fastnear.com"
VITE_REF_CONTRACT_ID = "v2.ref-finance.near"
VITE_WRAP_NEAR_CONTRACT_ID = "wrap.near"
VITE_EXPLORER_URL = "https://nearblocks.io"
VITE_FEE_RECEIVER = "nearpoolpf.near"
VITE_FEE_NEAR = "0.1"
VITE_WALLETCONNECT_PROJECT_ID = "7f0cf24607660fc883b16c16902f5b08"

# --- Worker runtime (/api/rpc proxy, activity feed) ---
NEAR_FALLBACK_RPC_URLS = "https://free.rpc.fastnear.com,https://near.lava.build,https://rpc.mainnet.fastnear.com"
REF_CONTRACT_ID = "v2.ref-finance.near"

[observability]
enabled = true
